name: 手動觸發任務範例
on:
  push:
    branches:
      - test_workflows  # 只要推送到這個分支就跑
  workflow_dispatch:    # 保留手動按鈕

    # 你可以定義輸入參數（選填）
    inputs:
      logLevel:
        description: 'log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      tags:
        description: '版本標籤'
        required: false
        type: string

jobs:
  manual-job:
    runs-on: ubuntu-latest
    steps:
      - name: 顯示輸入參數
        run: |
          echo "Log level: ${{ github.event.inputs.logLevel }}"
          echo "Tags: ${{ github.event.inputs.tags }}"